kind = "web"
previewPath = "/"
title = "Potli's Ocean Adventure Games"
version = "1.0.0"
id = "artifacts/potli-games"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26260

[services.development]
run = "pnpm --filter @workspace/potli-games run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/potli-games", "run", "build" ]
publicDir = "artifacts/potli-games/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26260"
BASE_PATH = "/"
